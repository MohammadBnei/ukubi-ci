# Pin several images in the caller's helm values in ONE commit, so ArgoCD rolls
# them out together (ukubi-game's game and realm must speak the same protocol).
# The caller builds each with image.yml `deploy: false`, then calls this with
# their outputs. The stale-run guard, bump and commit steps are image.yml's
# deploy steps, byte-identical (test/reusable.sh checks it).
#
# The caller's job must grant `contents: write`.
# Inputs reach scripts through env only, never inline ${{ }}.
name: deploy

on:
  workflow_call:
    inputs:
      pins:
        description: >-
          One "<values file> <sha12>@sha256:<64 hex>" per line (image.yml's
          tag and digest outputs joined by @). Each file once; all land in one
          commit.
        type: string
        required: true
      built-commit:
        description: The full sha the images were built from (image.yml's commit output), for the stale-run guard.
        type: string
        required: true
      deploy-branch:
        description: >-
          Branch the bump commits to. Default deploy: the default branch only
          takes reviewed merges, and ArgoCD layers the pin files on this branch
          over the default branch's values. Set it to '' to commit to the default
          branch (the pre-0.11 behaviour).
        type: string
        default: deploy
      values-key:
        description: yq path of the quoted tag value in every file, two-space indented YAML.
        type: string
        default: .image.tag
      runs-on:
        description: >-
          JSON list of runner labels; needs bash, git and curl (yq is installed
          by a step). The default is the container runner label on Forgejo;
          GitHub callers pass their own.
        type: string
        default: '["ubuntu-latest"]'
      commit-author:
        description: Bump commit author name. Empty is "<repo>-ci".
        type: string
        default: ''

jobs:
  # Only push/dispatch on the default branch deploys, as in image.yml. Decided
  # in shell: Forgejo mis-evaluates long if: expressions that mix ! and &&.
  guard:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      deploy: ${{ steps.guard.outputs.deploy }}
    steps:
      # test/check.sh runs this block verbatim; keep the name.
      - name: Decide whether this run may deploy
        id: guard
        env:
          EVENT: ${{ github.event_name != 'workflow_call' && github.event_name || github.event.pull_request && 'pull_request' || github.event.workflow_run && 'workflow_run' || github.event.pusher && 'push' || github.event.workflow && 'workflow_dispatch' || 'workflow_call' }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deploy=false
          case "$EVENT" in push|workflow_dispatch)
            if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then deploy=true; fi ;;
          esac
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          [ "$deploy" = true ] || echo "::notice::$EVENT on $REF does not deploy"

  deploy:
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    # Not image.yml's per-image group on purpose: GitHub keeps one pending job
    # per group and cancels the older, so one shared group would let wird's
    # adminweb bump cancel a pending api bump. Distinct groups push through
    # the pull --rebase retries (different lines, no conflict).
    concurrency:
      group: ukubi-ci-deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PINS: ${{ inputs.pins }}
      BUILT: ${{ inputs.built-commit }}
      VALUES_KEY: ${{ inputs.values-key }}
      DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
      BRANCH: ${{ github.event.repository.default_branch }}
      AUTHOR: ${{ inputs.commit-author != '' && inputs.commit-author || format('{0}-ci', github.event.repository.name) }}
      MESSAGE: 'chore(deploy): bump ${{ github.event.repository.name }} images'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      # The runner has no yq and sudo is buildah-only: a pinned release, checked by sha256.
      - name: Install yq
        run: |
          set -euo pipefail
          v=4.44.3
          sha=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
          curl -sSfLo "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/v$v/yq_linux_amd64"
          echo "$sha  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Bumps land on their own branch (ukubi option B): the default branch only
      # takes reviewed merges. A missing deploy branch starts as an orphan
      # holding only the pin files; the stale check below still reaches the
      # default branch's history (it unshallows it). A concurrent first push
      # by another image of the same repo fails the rebase loudly; the next
      # run lands. test/check.sh runs this block verbatim; keep the name.
      - name: Switch to the deploy branch
        run: |
          set -euo pipefail
          target=${DEPLOY_BRANCH:-$BRANCH}
          [ "$target" != "$BRANCH" ] || exit 0
          if [[ "$target" == -* ]] || ! git check-ref-format --branch "$target" >/dev/null 2>&1; then
            echo "::error::bad deploy-branch: '$target'"; exit 1
          fi
          # The exact ref (ls-remote alone matches by suffix); a failing
          # ls-remote fails the step instead of reading as "no branch".
          head=$(git ls-remote origin "refs/heads/$target" | awk -v r="refs/heads/$target" '$2 == r')
          if [ -n "$head" ]; then
            git fetch -q origin "+refs/heads/$target:refs/remotes/origin/$target"
            git checkout -q -B "$target" "refs/remotes/origin/$target"
          else
            git checkout -q --orphan "$target"
            git rm -rqf --cached . >/dev/null
            git clean -fdxq
          fi

      - name: Check inputs
        run: |
          set -euo pipefail
          [[ "$VALUES_KEY" =~ ^(\.[A-Za-z0-9_-]+)+$ ]] || { echo "::error::bad values-key: $VALUES_KEY"; exit 1; }

      # Re-running all jobs of an OLD run would roll the values back. Skip only
      # on a re-run (attempt > 1; a fresh dispatch, even a rollback, deploys),
      # when the commit already pinned in ANY file is a strict descendant of
      # the built one (the tag is a 12-char sha; unknown or ambiguous deploys).
      # This step, the bump and the commit are byte-identical in image.yml and
      # deploy.yml (test/reusable.sh). test/check.sh runs it verbatim; keep the name.
      - name: Skip a stale run
        id: fresh
        run: |
          set -euo pipefail
          [[ "$BUILT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::built commit missing or malformed ('$BUILT')"; exit 1; }
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch -q --unshallow origin "$BRANCH"; fi
          # PINS: one "<values file> <sha12>@sha256:<64 hex>" per line.
          files=(); vals=()
          while read -r f v extra; do
            [ -n "$f" ] || continue
            # No ., .. or empty segment: one spelling per file, so the twice check holds.
            [[ "$f" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ && "/$f/" != *"/./"* && "/$f/" != *"/../"* && "/$f/" != *"//"* ]] \
              || { echo "::error::bad values file: '$f'"; exit 1; }
            [ ! -L "$f" ] || { echo "::error::values file is a symlink: '$f'"; exit 1; }
            [[ "$v" =~ ^[0-9a-f]{12,40}@sha256:[0-9a-f]{64}$ && -z "$extra" ]] \
              || { echo "::error::bad pin for $f: '$v${extra:+ $extra}' (want <sha12>@sha256:<64 hex>)"; exit 1; }
            # Every image from the built commit: one rollout, one protocol.
            [[ "$BUILT" == "${v%%@*}"* ]] \
              || { echo "::error::pin for $f is not of the built commit '$BUILT': '$v'"; exit 1; }
            [[ " ${files[*]-} " != *" $f "* ]] || { echo "::error::values file listed twice: '$f'"; exit 1; }
            files+=("$f"); vals+=("$v")
          done <<< "$PINS"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no values file (no pins)"; exit 1; }
          stale=
          for f in "${files[@]}"; do
            p=$(yq "$VALUES_KEY" "$f" 2>/dev/null || true); p=${p%%@*}
            pc=$(git rev-parse -q --verify "$p^{commit}" 2>/dev/null || true)
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] && [ -n "$pc" ] && [ "$pc" != "$BUILT" ] && git merge-base --is-ancestor "$BUILT" "$pc"; then
              stale=$pc
            fi
          done
          if [ -n "$stale" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping deploy: pinned $stale is newer than built $BUILT; a re-run of an old run must not roll back"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # test/check.sh runs this block verbatim against fixtures; keep the name.
      # yq -i would reformat most values files (drops blank lines), so a
      # one-line sed does the edit and yq only reads it back. The pin is
      # <sha>@<digest>: the chart renders repository:<this>, which the kubelet
      # pulls by digest, so a rebuild rolls out even under IfNotPresent.
      - name: Bump the pinned image tag
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -euo pipefail
          files=(); vals=()
          while read -r f v extra; do
            [ -n "$f" ] || continue
            # No ., .. or empty segment: one spelling per file, so the twice check holds.
            [[ "$f" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ && "/$f/" != *"/./"* && "/$f/" != *"/../"* && "/$f/" != *"//"* ]] \
              || { echo "::error::bad values file: '$f'"; exit 1; }
            [ ! -L "$f" ] || { echo "::error::values file is a symlink: '$f'"; exit 1; }
            [[ "$v" =~ ^[0-9a-f]{12,40}@sha256:[0-9a-f]{64}$ && -z "$extra" ]] \
              || { echo "::error::bad pin for $f: '$v${extra:+ $extra}' (want <sha12>@sha256:<64 hex>)"; exit 1; }
            # Every image from the built commit: one rollout, one protocol.
            [[ "$BUILT" == "${v%%@*}"* ]] \
              || { echo "::error::pin for $f is not of the built commit '$BUILT': '$v'"; exit 1; }
            [[ " ${files[*]-} " != *" $f "* ]] || { echo "::error::values file listed twice: '$f'"; exit 1; }
            files+=("$f"); vals+=("$v")
          done <<< "$PINS"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no values file (no pins)"; exit 1; }
          leaf=${VALUES_KEY##*.}
          dots=${VALUES_KEY//[^.]/}
          indent=$(printf '%*s' $(( (${#dots} - 1) * 2 )) '')
          for i in "${!files[@]}"; do
            f=${files[$i]}; TAG=${vals[$i]}
            # First bump on a deploy branch: the pin file starts as the key alone.
            if [ -n "${DEPLOY_BRANCH:-}" ] && [ "$DEPLOY_BRANCH" != "${BRANCH:-}" ] && [ ! -e "$f" ]; then
              mkdir -p "$(dirname "$f")"
              read -ra segs <<< "${VALUES_KEY//./ }"; ind=''
              {
                echo "# Image pin, written by ukubi-ci on every deploy; ArgoCD layers it over the default branch's values."
                for k in "${segs[@]:0:${#segs[@]}-1}"; do echo "$ind$k:"; ind="$ind  "; done
                echo "$ind$leaf: \"none\""
              } > "$f"
            fi
            [ -f "$f" ] || { echo "::error::$f not found"; exit 1; }
            # Same sha and digest: nothing to bump. buildah bud is not reproducible
            # (created timestamp), so any rebuild gets a new digest and redeploys;
            # only re-running this deploy job alone lands here.
            if [ "$(yq "$VALUES_KEY" "$f")" = "$TAG" ]; then
              echo "::notice::$f $VALUES_KEY is already $TAG"; continue
            fi
            orig=$(mktemp); cp "$f" "$orig"
            sed -i -E "s/^(${indent}${leaf}: \")[^\"]+(\")/\1${TAG}\2/" "$f"
            # Exactly one line changed: catches a no-op sed (green deploy, old
            # image) and a second same-named key elsewhere.
            [ "$(diff "$orig" "$f" | grep -c '^[<>]')" = 2 ] \
              || { echo "::error::tag bump must change exactly one line of $f"; exit 1; }
            [ "$(yq "$VALUES_KEY" "$f")" = "$TAG" ] \
              || { echo "::error::tag bump did not land on $VALUES_KEY in $f"; exit 1; }
          done

      # One commit for every file: a multi-image rollout lands atomically.
      - name: Commit and push
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name "$AUTHOR"
          git config user.email "noreply@bnei.dev"
          files=()
          while read -r f _; do
            if [ -n "$f" ]; then files+=("$f"); fi
          done <<< "$PINS"
          git add -- "${files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m "$MESSAGE" -m "$PINS"
          target=${DEPLOY_BRANCH:-$BRANCH}
          # Other bumps push to the same branch; retry if it moves.
          for _ in 1 2 3; do
            head=$(git ls-remote origin "refs/heads/$target" | awk -v r="refs/heads/$target" '$2 == r')
            if [ -n "$head" ] && ! git pull -q --rebase origin "$target"; then
              git rebase --abort 2>/dev/null || true
              echo "::error::the bump does not rebase onto $target"; exit 1
            fi
            git push origin "HEAD:refs/heads/$target" && exit 0
            sleep 5
          done
          echo "::error::could not push the tag bump"; exit 1
