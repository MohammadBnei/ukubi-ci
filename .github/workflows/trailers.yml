# Commit and PR hygiene for a pull request: refuses vendor attribution in the
# PR's own commits (message, author, committer) and its body, and optionally
# requires Conventional Commit subjects and title. The ban set is the union of
# the inline checks it replaces (drop and hq checks.yml, has-journal
# check-trailers.sh, wird check-commits.sh); wird's broader unanchored
# "generated with" comes in through `extra-banned`.
#
# Scope is the PR only: commits reachable from the head and from neither the
# base sha nor the current base branch. History is never scanned, so an old
# dirty commit on main never fails a PR. Any other event is a green no-op.
#
# The title and body are read from the event, so the caller should list
# `types: [opened, edited, synchronize, reopened]` to re-check a title edit.
# Inputs reach the script through env only, never inline ${{ }}.
name: trailers

on:
  workflow_call:
    inputs:
      conventional:
        description: Require Conventional Commit subjects (non-merge commits) and PR title.
        type: boolean
        default: false
      allow-prefixes:
        description: Multiline literal subject prefixes exempt from the Conventional rule only (never from the ban).
        type: string
        default: ''
      agent-trailers:
        description: "any (no rule), forbid (no agent Co-Authored-By or Agent-Session at all), pair (both well formed: ukubi-claude-<host> or ukubi-agent, or neither)."
        type: string
        default: any
      extra-banned:
        description: An extra case-insensitive ERE refused in messages, idents and the PR body (e.g. wird's 'generated with').
        type: string
        default: ''

jobs:
  trailers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # The head commit, full history, no token: the scan only reads git objects.
      - if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Full commit history without old file contents: only commits are read.
          filter: blob:none
          persist-credentials: false

      # test/reusable.sh runs this block verbatim against throwaway repos; keep the name.
      - name: Check commits and PR text
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CONVENTIONAL: ${{ inputs.conventional }}
          ALLOW_PREFIXES: ${{ inputs.allow-prefixes }}
          AGENT_TRAILERS: ${{ inputs.agent-trailers }}
          EXTRA_BANNED: ${{ inputs.extra-banned }}
        run: |
          set -euo pipefail
          case "$EVENT" in pull_request|pull_request_target) ;; *)
            echo "::notice::trailers checks a pull request's own commits only; $EVENT is a no-op"; exit 0 ;;
          esac
          [[ "$BASE" =~ ^[0-9a-f]{40,64}$ && "$HEAD" =~ ^[0-9a-f]{40,64}$ ]] \
            || { echo "::error::need the PR base and head shas, got '$BASE' '$HEAD'"; exit 1; }
          [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad base ref '$BASE_REF'"; exit 1; }
          case "$AGENT_TRAILERS" in any|forbid|pair) ;; *)
            echo "::error::agent-trailers is any, forbid or pair, got '$AGENT_TRAILERS'"; exit 1 ;;
          esac
          # Forms, not words: anchored trailers and footers, so prose about the
          # rule ("Code generated with stringer.") passes. URLs and the vendor
          # noreply address are refused anywhere.
          ban='noreply@anthropic\.com|claude\.(ai|com)/|^[[:space:]]*claude-session:|^[^[:alnum:]]*generated (with|by)([^[:alnum:]]|$)'
          # Any Co-Authored-By naming claude, anthropic or a model is refused,
          # except the exact ukubi agent form, which is dropped before the test.
          ban+='|^co-authored-by:.*(claude|anthropic|opus|sonnet|haiku|gpt)'
          # CRs are stripped (a body saved from the web editor is CRLF). No pipe:
          # under pipefail, grep -q exiting early SIGPIPEs the writer and a match
          # on large input would read as "not banned".
          banned() {
            grep -Eiq -- "$ban" < <(grep -Ev -- '^Co-Authored-By: ukubi-claude-[A-Za-z0-9-]+ <noreply@bnei\.dev>$' <<<"${1//$'\r'/}")
          }
          # Controls: a known-bad form must be caught, a known-good line must pass.
          for s in 'Co-Authored-By: Claude <noreply@anthropic.com>' 'see https://claude.ai/code/x' 'claude.com/x' \
                   'Claude-Session: abc' 'generated with Claude Code' '🤖 Generated with [x](y)' 'Generated by Claude' 'Generated by buf generate' \
                   'Co-Authored-By: Bot <x@anthropic.com>' 'Co-Authored-By: Claude Opus <a@b>' \
                   'Co-Authored-By: Foo (Claude) <a@b>' 'Co-Authored-By: ukubi-claude-x <noreply@anthropic.com>'; do
            banned "$s" || { echo "::error::ban control missed: $s"; exit 1; }
          done
          for s in 'Agent-Session: x' 'Ban bare "Claude-Session:" lines too.' 'Code generated with stringer.' \
                   'the footer as "Generated with [x"' 'Co-Authored-By: ukubi-claude-macbook <noreply@bnei.dev>' \
                   'Co-Authored-By: ukubi-claude-gptbox <noreply@bnei.dev>'; do
            ! banned "$s" || { echo "::error::ban control false positive: $s"; exit 1; }
          done
          # The caller's extra pattern joins after the controls (it may be broader).
          if [ -n "$EXTRA_BANNED" ]; then
            rc=0; grep -Eq -- "$EXTRA_BANNED" </dev/null || rc=$?
            [ "$rc" = 1 ] || { echo "::error::extra-banned is not a valid ERE: $EXTRA_BANNED"; exit 1; }
            ban+="|$EXTRA_BANNED"
          fi
          cc='^((feat|fix|refactor|test|docs|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: .+|Revert ".+")'
          conventional_ok() {
            local p
            while IFS= read -r p; do
              [ -n "$p" ] && [[ "$1" == "$p"* ]] && return 0
            done <<<"$ALLOW_PREFIXES"
            grep -Eq -- "$cc" <<<"$1"
          }
          # Fail closed: a range git cannot resolve must not list nothing and pass.
          range=("$HEAD" --not "$BASE" "origin/$BASE_REF")
          shas=$(git rev-list "${range[@]}") || { echo "::error::cannot list the PR's commits"; exit 1; }
          [ -n "$shas" ] || { echo "::error::the PR has no commits of its own (base $BASE, head $HEAD)"; exit 1; }
          merges=$(git rev-list --merges "${range[@]}") || { echo "::error::cannot list the PR's merges"; exit 1; }
          rc=0
          for c in $shas; do
            msg=$(git log -1 --format=%B "$c")
            who=$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$c")
            if banned "$msg"$'\n'"$who"; then echo "::error::$c carries vendor attribution"; rc=1; fi
            co=0 ses=0
            grep -Eiq '^co-authored-by:(.*(claude|anthropic)| *ukubi-)' <<<"$msg" && co=1
            grep -Eiq '^agent-session:' <<<"$msg" && ses=1
            case "$AGENT_TRAILERS" in
              forbid) [ $((co + ses)) = 0 ] || { echo "::error::$c carries an agent trailer; this repo forbids them"; rc=1; } ;;
              pair) if [ $((co + ses)) -gt 0 ] && ! { grep -Eq '^Co-Authored-By: ukubi-(claude-[A-Za-z0-9-]+|agent) <noreply@bnei\.dev>$' <<<"$msg" \
                        && grep -Eq '^Agent-Session: [^[:space:]]+$' <<<"$msg"; }; then
                      echo "::error::$c is an agent commit without both well-formed trailers"; rc=1
                    fi ;;
            esac
            # Merge subjects are git's or GitHub's own; the ban above still applies.
            if [ "$CONVENTIONAL" = true ] && ! grep -qx "$c" <<<"$merges"; then
              subj=$(head -n1 <<<"$msg")
              conventional_ok "$subj" || { echo "::error::$c subject is not a Conventional Commit: $subj"; rc=1; }
            fi
          done
          # A squash merge lands the title on the base branch.
          if [ "$CONVENTIONAL" = true ]; then
            t=$(sed -E 's/ \(#[0-9]+\)$//' <<<"$PR_TITLE")
            conventional_ok "$t" || { echo "::error::PR title is not a Conventional Commit: $PR_TITLE"; rc=1; }
          fi
          if banned "$PR_TITLE"$'\n'"$PR_BODY"; then echo "::error::the PR title or body carries vendor attribution"; rc=1; fi
          exit $rc
