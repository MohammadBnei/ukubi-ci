# Build one image with buildah, push it to the Zot registry, then pin the tag
# in the caller's helm values so ArgoCD rolls it out. Generalised from
# drop/mountain/ukubi-bridge app.yml. Their gotchas, paid for once:
#   - every buildah call is `sudo -n buildah`: the build-runner sudoers grants
#     /usr/bin/buildah only, and anything else hangs on a password prompt
#     (-n makes a missing grant fail at once instead)
#   - --tls-verify=false on login AND push (plain HTTP; LE can't issue for .lan)
#   - a per-job --authfile plus logout: every runner sudoes into the same root,
#     so root's shared auth file would keep the password for later jobs
#   - build BEFORE fetching the password: a broken Dockerfile fails on its own
#     terms, and the password is never in the env while RUN steps execute
#   - --layers, or buildah caches nothing; --pull=newer, or the base image
#     stays at the patch the box first pulled (both inputs, default on)
#   - the deploy job needs always() && result == 'success'
#   - the bump pushes with GITHUB_TOKEN, which never triggers another run
#
# The caller's job must grant `contents: write` and `id-token: write`, also on
# pull_request (GitHub checks nested permissions before any job starts).
# Inputs reach scripts through env only, never inline ${{ }}.
name: image

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON list of runner labels for the build job, e.g. '["self-hosted","ukubi-build"]'.
        type: string
        required: true
      image:
        description: Image name under the registry, e.g. drop.
        type: string
        required: true
      ref:
        description: Git ref to build (a release tag). Empty builds the triggering commit.
        type: string
        default: ''
      context:
        description: Build context, relative to the repo root.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path, relative to the repo root (not to context).
        type: string
        default: Dockerfile
      target:
        description: Optional multi-stage --target.
        type: string
        default: ''
      build-args:
        description: Multiline KEY=VALUE, one per line. Not secret; never put a secret here.
        type: string
        default: ''
      layers:
        description: Pass --layers (cache intermediate layers on the box).
        type: boolean
        default: true
      pull-newer:
        description: Pass --pull=newer (refresh the base image).
        type: boolean
        default: true
      values-file:
        description: Helm values file to bump on the default branch. Empty (with values-files empty) skips the deploy job.
        type: string
        default: helm/values.yaml
      values-files:
        description: >-
          Several values files of THIS image only (one call per image), newline or
          space separated, each pinning the same values-key; bumped in one commit. When set it replaces values-file. The
          stale-run guard reads the pin from the first one.
        type: string
        default: ''
      version:
        description: >-
          The release version (X.Y.Z, release.yml's `version` output) for the
          VERSION build arg. Used only with version-arg; empty is valid only
          with an empty ref (no release exists yet).
        type: string
        default: ''
      version-arg:
        description: >-
          Pass --build-arg VERSION: ref's release as X.Y.Z, else X.Y.Z+sha12 on
          the default branch, else X.Y.Z-dev+sha12 (0.0.0 before the first release).
        type: boolean
        default: false
      cancel-in-progress:
        description: Cancel an older build of the same image and ref when a newer one starts. false queues (a release callers' tag is pushed before the build).
        type: boolean
        default: true
      values-key:
        description: yq path of the quoted tag value, two-space indented YAML.
        type: string
        default: .image.tag
      registry:
        type: string
        default: registry.bnei.lan:5000
      registry-secret-path:
        description: >-
          Infisical folder holding REGISTRY_PASSWORD. Only REGISTRY_PASSWORD is
          kept from it, but the action fetches the whole folder, so a dedicated
          folder (e.g. /registry) keeps app secrets from being read at all.
        type: string
        default: /
      build-timeout-minutes:
        description: Cap for the build job; a hung buildah would hold the shared runner for GitHub's 6 hours.
        type: number
        default: 60
    secrets:
      build-secrets:
        description: Multiline id=value; each becomes `--secret id=<id>` (RUN --mount=type=secret,id=<id>).
        required: false
    outputs:
      tag:
        description: The pushed image tag (12-character short sha).
        value: ${{ jobs.build.outputs.tag }}
      commit:
        description: The full sha of the built commit.
        value: ${{ jobs.build.outputs.commit }}
      digest:
        description: The pushed manifest digest (sha256:...); empty when nothing was pushed.
        value: ${{ jobs.build.outputs.digest }}

env:
  REGISTRY: ${{ inputs.registry }}
  # Not a secret, and an empty secret cost agent-fleet a release once.
  REGISTRY_USER: ci
  IMAGE: ${{ inputs.image }}
  # The registry password comes from the shared platform-commons project over
  # GitHub OIDC (infra-bootstrap ADR-0049). Under workflow_call the claims are
  # the CALLER's: the caller repo must be on the identity's repository list
  # (build-runner-ops step 3), else "OIDC claim not allowed" / 401.
  INFISICAL_DOMAIN: https://infisical.bnei.dev
  INFISICAL_PROJECT_SLUG: platform-commons-76pb
  INFISICAL_ENV: dev
  INFISICAL_IDENTITY_ID: 19807471-d73a-48d4-9e58-1dc34255ef77

jobs:
  # Its own GitHub-hosted job, so a refused PR never lands on the shared box.
  # An allowlist: a self-hosted runner matches on any of its labels (e.g.
  # just "ukubi-build", or "Self-Hosted": labels are case-insensitive), so on
  # pull_request every label must be a GitHub-hosted ubuntu-* one. This is a
  # tripwire, not the boundary: a PR can edit the caller's app.yml to skip
  # image.yml entirely. The boundary is the runner and repo settings
  # (build-runner-ops: per-repo runners, fork PR approval).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a non-GitHub-hosted runner on pull_request
        env:
          EVENT: ${{ github.event_name }}
          RUNS_ON: ${{ inputs.runs-on }}
        run: |
          set -euo pipefail
          # pull_request_target too: it runs with secrets, so building PR code there is worse.
          case "$EVENT" in pull_request|pull_request_target) ;; *) exit 0 ;; esac
          # jq missing or RUNS_ON not a JSON list also refuses (fail closed).
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^ubuntu-"; "i"))' <<<"$RUNS_ON" >/dev/null 2>&1; then
            echo "::error::pull_request must build on GitHub-hosted ubuntu-* runners only, not $RUNS_ON"; exit 1
          fi

  build:
    needs: guard
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    concurrency:
      group: ukubi-ci-image-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    permissions:
      contents: read
      id-token: write # the Infisical OIDC login
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      commit: ${{ steps.commit.outputs.value }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check inputs
        env:
          VALUES_KEY: ${{ inputs.values-key }}
          VERSION_ARG_ON: ${{ inputs.version-arg }}
          VERSION_IN: ${{ inputs.version }}
          BUILD_ARGS_IN: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          if [ "$VERSION_ARG_ON" != true ] && [ -n "$VERSION_IN" ]; then
            echo "::warning::version is set but version-arg is false: no VERSION build arg is passed"
          fi
          if [ "$VERSION_ARG_ON" = true ] && grep -qE '^[[:space:]]*VERSION=' <<<"$BUILD_ARGS_IN"; then
            echo "::error::build-args already sets VERSION; use version-arg or build-args, not both"; exit 1
          fi
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*$ ]] || { echo "::error::bad image name: $IMAGE"; exit 1; }
          [[ "$VALUES_KEY" =~ ^(\.[A-Za-z0-9_-]+)+$ ]] || { echo "::error::bad values-key: $VALUES_KEY"; exit 1; }

      # No token in .git/config: the context (often `.`) holds .git, and RUN
      # steps or a `COPY . .` would see it on the shared box and in the image.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Compute the image tag
        id: tag
        run: echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # The commit actually built (inputs.ref may be a release tag).
      - name: Record the built commit
        id: commit
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Mirrors drop/hq/wird/stt: an empty or misnamed version would ship
      # VERSION "" silently, so it must be X.Y.Z, or empty with no release ref.
      # Read by the Build step through GITHUB_ENV (its text must stay identical
      # to image-build.yml's, which has no such step).
      - name: Compute the build version
        if: inputs.version-arg
        env:
          TAG: ${{ steps.tag.outputs.value }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ( -z "$VERSION" && -z "$RELEASE_TAG" ) ]] \
            || { echo "::error::bad version '$VERSION' (ref '$RELEASE_TAG'): pass release.yml's version output"; exit 1; }
          # No release ref: this commit is not a release. On the default branch
          # VERSION is the last release, so X.Y.Z+<sha>, or 0.0.0+<sha> before
          # the first. Elsewhere it is a dry run: X.Y.Z-dev+<sha>.
          if [ -z "$RELEASE_TAG" ]; then
            if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              VERSION="${VERSION:-0.0.0}+$TAG"
            else
              VERSION="${VERSION:-0.0.0}-dev+$TAG"
            fi
          fi
          echo "VERSION_ARG=VERSION=$VERSION" >> "$GITHUB_ENV"

      # The runner cannot install tools (sudo is buildah-only); the playbook does.
      - name: Check buildah
        run: command -v buildah || { echo "::error::buildah is not installed on this runner"; exit 1; }

      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.value }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ inputs.build-args }}
          LAYERS: ${{ inputs.layers }}
          PULL_NEWER: ${{ inputs.pull-newer }}
          BUILD_SECRETS: ${{ secrets.build-secrets }}
        run: |
          set -euo pipefail
          args=(--isolation chroot --format docker -f "$DOCKERFILE" -t "$REGISTRY/$IMAGE:$TAG")
          [ "$LAYERS" = true ] && args+=(--layers)
          [ "$PULL_NEWER" = true ] && args+=(--pull=newer)
          [ -n "$TARGET" ] && args+=(--target "$TARGET")
          [ -n "${VERSION_ARG:-}" ] && args+=(--build-arg "$VERSION_ARG")
          while IFS= read -r a; do
            [ -n "$a" ] && args+=(--build-arg "$a")
          done <<< "$BUILD_ARGS"
          sdir=$(mktemp -d); trap 'rm -rf "$sdir"' EXIT
          while IFS= read -r s; do
            [ -n "$s" ] || continue
            id=${s%%=*}; val=${s#*=}
            [[ "$id" =~ ^[A-Za-z0-9_.-]+$ && "$s" == *=* ]] || { echo "::error::build-secrets lines are id=value"; exit 1; }
            echo "::add-mask::$val"
            (umask 077; printf '%s' "$val" > "$sdir/$id")
            args+=(--secret "id=$id,src=$sdir/$id")
          done <<< "$BUILD_SECRETS"
          sudo -n buildah bud "${args[@]}" "$CONTEXT"

      # The action has no single-secret option (a `secret-name` input does not
      # exist), and export-type env would put EVERY secret at secret-path into
      # the env of all later steps. So it writes a file (in the workspace, after
      # the build) and the next step lifts REGISTRY_PASSWORD alone. The identity's
      # bound claims allow push and workflow_dispatch only, so nothing else asks.
      # A dedicated folder (input registry-secret-path) stops them being fetched.
      - name: Read the registry password from Infisical
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: Infisical/secrets-action@a663da43e1541832614bfd9dcf9ab67381ea2b98 # v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: infisical.bnei.dev
          domain: ${{ env.INFISICAL_DOMAIN }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV }}
          secret-path: ${{ inputs.registry-secret-path }}
          export-type: file
          file-output-path: /.infisical-secrets

      # GitHub masks only secrets.*; an unmasked Infisical value leaked a token
      # in this estate once. The file holds KEY='value' lines; only this one
      # reaches GITHUB_ENV, and the file is deleted either way.
      # test/check.sh runs this block verbatim; keep the name.
      - name: Keep only the registry password
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          f="$GITHUB_WORKSPACE/.infisical-secrets"
          line=$(grep -m1 "^REGISTRY_PASSWORD='" "$f" || true); rm -f "$f"
          [ -n "$line" ] || { echo "::error::Infisical returned no REGISTRY_PASSWORD"; exit 1; }
          pw=${line#REGISTRY_PASSWORD=\'}; pw=${pw%\'}
          echo "::add-mask::$pw"
          echo "REGISTRY_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Registry login
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          [ -n "${REGISTRY_PASSWORD:-}" ] || { echo "::error::Infisical returned no REGISTRY_PASSWORD"; exit 1; }
          printf '%s' "$REGISTRY_PASSWORD" | sudo -n buildah login \
            --authfile "$RUNNER_TEMP/registry-auth.json" \
            --tls-verify=false \
            --username "$REGISTRY_USER" \
            --password-stdin "$REGISTRY"

      # The digest is what the deploy pins: a rebuild of the same commit (base
      # image CVE fix) keeps the sha tag but gets a new digest.
      - name: Push
        id: push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          sudo -n buildah push --authfile "$RUNNER_TEMP/registry-auth.json" \
            --tls-verify=false --digestfile "$RUNNER_TEMP/digest" "$REGISTRY/$IMAGE:$TAG"
          d=$(cat "$RUNNER_TEMP/digest")
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      # Its own step, so a failed push does not leave the tag in the shared store.
      - name: Remove the local image
        if: always() && steps.tag.outputs.value != ''
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: sudo -n buildah rmi "$REGISTRY/$IMAGE:$TAG" || true

      # The runner user cannot sudo rm, but buildah can clear its own entry.
      - name: Registry logout
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: sudo -n buildah logout --authfile "$RUNNER_TEMP/registry-auth.json" "$REGISTRY" || true

  deploy:
    needs: build
    # Only push/dispatch on the default branch deploys; a branch dispatch builds.
    if: >-
      always() && needs.build.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (inputs.values-files != '' || inputs.values-file != '')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ukubi-ci-image-${{ inputs.image }}-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      DIGEST: ${{ needs.build.outputs.digest }}
      BUILT: ${{ needs.build.outputs.commit }}
      VALUES_FILES: ${{ inputs.values-files != '' && inputs.values-files || inputs.values-file }}
      VALUES_KEY: ${{ inputs.values-key }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Re-running all jobs of an OLD run would roll the values back. Skip only
      # on a re-run (attempt > 1; a fresh dispatch, even a rollback, deploys),
      # when the commit already pinned in the values is a strict descendant of
      # the built one (the tag is a 12-char sha; unknown or ambiguous deploys).
      # test/check.sh runs this block verbatim; keep the name.
      - name: Skip a stale run
        id: fresh
        run: |
          set -euo pipefail
          [[ "$BUILT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::built commit missing or malformed ('$BUILT')"; exit 1; }
          [ "$(git rev-parse --is-shallow-repository)" = true ] && git fetch -q --unshallow origin "$BRANCH" || true
          read -ra files <<< "${VALUES_FILES//$'\n'/ }"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no values file (values-files is blank)"; exit 1; }
          for f in "${files[@]}"; do
            [[ "$f" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ && "/$f/" != *"/../"* ]] \
              || { echo "::error::bad values file: '$f'"; exit 1; }
            [ ! -L "$f" ] || { echo "::error::values file is a symlink: '$f'"; exit 1; }
          done
          # Stale if ANY file's pin strictly descends from the built commit.
          stale=
          for f in "${files[@]}"; do
            p=$(yq "$VALUES_KEY" "$f" 2>/dev/null || true); p=${p%%@*}
            pc=$(git rev-parse -q --verify "$p^{commit}" 2>/dev/null || true)
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] && [ -n "$pc" ] && [ "$pc" != "$BUILT" ] && git merge-base --is-ancestor "$BUILT" "$pc"; then
              stale=$pc
            fi
          done
          if [ -n "$stale" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping deploy: pinned $stale is newer than built $BUILT; a re-run of an old run must not roll back"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # test/check.sh runs this block verbatim against fixtures; keep the name.
      # yq -i would reformat most values files (drops blank lines), so a
      # one-line sed does the edit and yq only reads it back.
      - name: Bump the pinned image tag
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad image tag: '$TAG'"; exit 1; }
          # Pin <sha>@<digest>: the chart renders repository:<this>, a valid
          # reference the kubelet pulls by digest, so a rebuild rolls out even
          # under pullPolicy IfNotPresent. No bare-sha fallback: an empty digest
          # (e.g. the runner dropped the output) must fail, not silently skip.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::push digest missing or malformed ('$DIGEST'): the build job's digest output was empty or dropped"; exit 1; }
          TAG="$TAG@$DIGEST"
          echo "PINNED=$TAG" >> "${GITHUB_ENV:-/dev/null}"
          read -ra files <<< "${VALUES_FILES//$'\n'/ }"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no values file (values-files is blank)"; exit 1; }
          for f in "${files[@]}"; do
            [[ "$f" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ && "/$f/" != *"/../"* ]] \
              || { echo "::error::bad values file: '$f'"; exit 1; }
            [ ! -L "$f" ] || { echo "::error::values file is a symlink: '$f'"; exit 1; }
          done
          leaf=${VALUES_KEY##*.}
          dots=${VALUES_KEY//[^.]/}
          indent=$(printf '%*s' $(( (${#dots} - 1) * 2 )) '')
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::$f not found"; exit 1; }
            # Same sha and digest: nothing to bump. buildah bud is not reproducible
            # (created timestamp), so any rebuild gets a new digest and redeploys;
            # only re-running this deploy job alone lands here.
            if [ "$(yq "$VALUES_KEY" "$f")" = "$TAG" ]; then
              echo "::notice::$f $VALUES_KEY is already $TAG"; continue
            fi
            orig=$(mktemp); cp "$f" "$orig"
            sed -i -E "s/^(${indent}${leaf}: \")[^\"]+(\")/\1${TAG}\2/" "$f"
            # Exactly one line changed: catches a no-op sed (green deploy, old
            # image) and a second same-named key elsewhere.
            [ "$(diff "$orig" "$f" | grep -c '^[<>]')" = 2 ] \
              || { echo "::error::tag bump must change exactly one line of $f"; exit 1; }
            [ "$(yq "$VALUES_KEY" "$f")" = "$TAG" ] \
              || { echo "::error::tag bump did not land on $VALUES_KEY in $f"; exit 1; }
          done

      - name: Commit and push
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name "$IMAGE-ci"
          git config user.email "noreply@bnei.dev"
          read -ra files <<< "${VALUES_FILES//$'\n'/ }"
          git add -- "${files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): bump $IMAGE image to $PINNED"
          # The default branch also takes local pushes; retry if it moves.
          for _ in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo "::error::could not push the tag bump"; exit 1
