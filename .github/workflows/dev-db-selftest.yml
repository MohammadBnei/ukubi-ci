# Runs the dev-db and dev-db-release actions against a throwaway IntegreSQL +
# Postgres started as job services. It runs on the podman runner
# (ubuntu-latest, CT 103): the Talos runner has no container engine for services:.
# Main and dispatch only, so no pull-request job leaves Talos; run it by
# dispatch on a branch before merging a change to the dev-db actions.
# IntegreSQL dials Postgres at startup (InitManager: 30 tries 1 s apart, then
# it exits) and listens only once that works, so roles.sql must land within
# about 30 s of the services starting: it is the first step after checkout,
# with no install in between when the image has psql. Until IntegreSQL
# listens, the action retries POST (000/503); timeout-seconds 120 makes an
# IntegreSQL that gave up fail the job in 2 min, not at its 10 min timeout.
# Covers build, recreate, reuse and keep; test/dev-db/run.sh adds the cancel,
# kill, exhausted-pool and two-repo cases locally with test/dev-db/compose.yml.
name: dev-db-selftest

on:
  push:
    branches: [main]
    paths: [actions/dev-db/**, actions/dev-db-release/**, test/dev-db/**, .github/workflows/dev-db-selftest.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: pgpass
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 1s --health-retries 30
      integresql:
        image: ghcr.io/allaboutapps/integresql:v1.1.0@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        env:
          INTEGRESQL_PGHOST: postgres
          INTEGRESQL_PGPORT: "5432"
          INTEGRESQL_PGUSER: integresql
          INTEGRESQL_PGPASSWORD: mgrpass
          INTEGRESQL_TEST_PGUSER: integresql_test
          INTEGRESQL_TEST_PGPASSWORD: testpass
          INTEGRESQL_ROOT_TEMPLATE: template1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install psql and create IntegreSQL's roles
        env:
          PGPASSWORD: pgpass
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f test/dev-db/roles.sql
      - name: Build the template and get a database
        uses: ./actions/dev-db
        with:
          integresql-url: http://integresql:5000
          postgres-host: postgres
          template-hash: selftest
          timeout-seconds: '120'
          seed-command: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE t(id int); INSERT INTO t VALUES (1)'
      - run: bash test/dev-db/check.sh seeded
      - name: Release (recreate)
        uses: ./actions/dev-db-release
      - name: Reuse the template; the seed command must not run
        uses: ./actions/dev-db
        with:
          integresql-url: http://integresql:5000
          postgres-host: postgres
          template-hash: selftest
          seed-command: exit 1
      - run: bash test/dev-db/check.sh fresh
      - name: Release with keep
        uses: ./actions/dev-db-release
        with:
          keep: 'true'
