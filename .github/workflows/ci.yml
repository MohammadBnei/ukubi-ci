name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Forgejo honours only workflow-level concurrency: a newer PR push cancels the
# older run; main runs queue (release.yml pushes a tag there).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which self-tests a PR needs: each runs only when its workflow or fixture
  # changed (ci.yml or actionlint.yaml changes run all). A push to main runs
  # all. Decided in shell; the jobs below only compare these outputs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      status: ${{ steps.d.outputs.status }}
      bun: ${{ steps.d.outputs.bun }}
      rust: ${{ steps.d.outputs.rust }}
      image: ${{ steps.d.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # test/check.sh runs this block verbatim; keep the name.
      - name: Pick the self-tests
        id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all=false files=''
          # --no-renames: a moved file counts on both its old and new path. A diff
          # that fails runs everything rather than nothing.
          if [ -z "$BASE" ]; then all=true; else files=$(git diff --no-renames --name-only "$BASE"...HEAD) || all=true; fi
          if grep -qE '^\.github/(workflows/ci\.yml|actionlint\.yaml)$' <<<"$files"; then all=true; fi
          out() { # name regex
            if $all || grep -qE "$2" <<<"$files"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"
          }
          out go '^(\.github/workflows/go-checks\.yml|test/fixture-go/)'
          out status '^(\.github/workflows/go-checks\.yml|standard-status/)'
          out bun '^(\.github/workflows/bun-checks\.yml|test/fixture-bun/)'
          out rust '^(\.github/workflows/rust-checks\.yml|test/fixture-rust/)'
          out image '^(\.github/workflows/(image|image-build|release)\.yml|test/fixture/|cliff\.toml$)'

  actionlint:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.7.12
      SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Pinned releases, checked by sha256. The runner has no shellcheck, so it
      # is installed too, and actionlint also lints every run block.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          v=0.10.0
          sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          f="shellcheck-v$v.linux.x86_64.tar.xz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/v$v/$f"
          echo "$sha  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" "shellcheck-v$v/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-v$v" >> "$GITHUB_PATH"
      - name: Install actionlint
        run: |
          set -euo pipefail
          f="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$f"
          echo "$SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint" -color

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The runner has no yq and sudo is buildah-only: a pinned release, checked by sha256.
      - name: Install yq
        run: |
          set -euo pipefail
          v=4.44.3
          sha=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
          curl -sSfLo "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/v$v/yq_linux_amd64"
          echo "$sha  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: |
          set -euo pipefail
          v=0.10.0
          sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          f="shellcheck-v$v.linux.x86_64.tar.xz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/v$v/$f"
          echo "$sha  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" "shellcheck-v$v/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-v$v" >> "$GITHUB_PATH"
      # The runner has no go either: the reusable.sh gofmt and vettool cases need it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/fixture-go/go.mod
          cache: true
          cache-dependency-path: '**/go.mod'
      - name: shellcheck
        run: shellcheck test/check.sh test/reusable.sh test/release.sh
      # release.yml's own install block: one copy of the git-cliff pin.
      - name: Install git-cliff
        run: yq '.jobs.release.steps[] | select(.name == "Install git-cliff") | .run' .github/workflows/release.yml | bash
      - name: image.yml run blocks against fixtures
        run: test/check.sh
      # go comes from setup-go above, so the gofmt and vettool cases run here too.
      - name: reusable workflows' run blocks against fixtures
        run: test/reusable.sh
      - name: release.yml's Release block against throwaway repos
        run: test/release.sh

  # release.yml as callers chain it: after the checks; on pull_request a dry
  # run, on push to main the real release (CHANGELOG commit + tag). Its
  # version reaches both image self-tests as the VERSION build-arg.
  release-self-test:
    needs: [actionlint, check]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  # The real build path on the self-hosted runner, build-only (pull_request
  # skips Infisical, login, push and deploy). The grants are needed even so:
  # GitHub checks the nested jobs' permissions before any job starts.
  self-test:
    if: github.event.pull_request && needs.changes.outputs.image == 'true'
    needs: [release-self-test, changes]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      runs-on: '["ukubi-build"]'
      image: ukubi-ci-selftest
      context: test/fixture
      dockerfile: test/fixture/Dockerfile
      build-args: |
        PROBE=from-build-args
        VERSION=${{ needs.release-self-test.outputs.version }}
      values-file: ''
    secrets:
      build-secrets: probe=from-build-secrets

  # The C2 reusable checks, each called the way a caller will, on its fixture.
  go-self-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/go-checks.yml
    with:
      working-directory: test/fixture-go
      golangci-lint-version: v2.14.0
      # Reaches the vettool path until ukubicheck (ukubi-go) ships.
      vettool: golang.org/x/tools/go/analysis/passes/nilness/cmd/nilness@v0.52.0
      govulncheck: true

  status-self-test:
    needs: changes
    if: needs.changes.outputs.status == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/go-checks.yml
    with:
      working-directory: standard-status
      golangci-lint-version: v2.14.0

  bun-self-test:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/bun-checks.yml
    with:
      working-directory: test/fixture-bun
      dist: dist
      lint-script: lint

  rust-self-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-checks.yml
    with:
      working-directory: test/fixture-rust
      # Not an advisory against this crate (it has no dependencies): proves only
      # that the flag parses. Blocking is tested by test/reusable.sh's fake cargo.
      audit-ignore: RUSTSEC-2026-0414

  image-build-self-test:
    needs: [release-self-test, changes]
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/image-build.yml
    with:
      image: ukubi-ci-selftest
      context: test/fixture
      dockerfile: test/fixture/Dockerfile
      build-args: |
        PROBE=from-build-args
        VERSION=${{ needs.release-self-test.outputs.version }}
    secrets:
      build-secrets: probe=from-build-secrets

  # This PR's own commits, with this repo's rule. On push it is the no-op path.
  trailers-self-test:
    # Always: it checks the PR's own commits and title, whatever they touch.
    permissions:
      contents: read
    uses: ./.github/workflows/trailers.yml
    with:
      conventional: true
      agent-trailers: pair
