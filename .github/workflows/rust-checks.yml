# Rust checks for one crate or workspace, the ukubi-stt shape: the toolchain
# rust-toolchain.toml names (required), fmt, clippy -D warnings, tests, and a
# blocking cargo audit. Inputs reach scripts through env only, never inline ${{ }}.
name: rust-checks

on:
  workflow_call:
    inputs:
      working-directory:
        description: The crate or workspace root (holds Cargo.toml, Cargo.lock and rust-toolchain.toml), relative to the repo root.
        type: string
        default: .
      apt-packages:
        description: Space-separated apt packages the build needs, e.g. protobuf-compiler. The runner cannot apt-get (sudo is buildah-only), so each must already be installed there (the build-runner playbook); the job fails naming the missing ones. Empty skips.
        type: string
        default: ''
      audit-ignore:
        description: Multiline RUSTSEC-YYYY-NNNN ids passed to cargo audit --ignore. .cargo/audit.toml is read as well; keep the reasons there.
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  # Plain rustup does not retry flaky downloads; at least cargo does.
  CARGO_NET_RETRY: 10

jobs:
  check:
    runs-on: [self-hosted, ukubi-build]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # test/reusable.sh runs the named blocks below verbatim; keep the names.
      - name: Check inputs
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          [ -f rust-toolchain.toml ] || { echo "::error::rust-toolchain.toml is required: it is where the toolchain is pinned"; exit 1; }
          # The same split as the install step: read -ra, no glob expansion.
          read -ra pkgs <<<"$APT_PACKAGES"
          for p in ${pkgs[@]+"${pkgs[@]}"}; do
            [[ "$p" =~ ^[a-z0-9][a-z0-9.+-]+$ ]] || { echo "::error::bad apt package name '$p'"; exit 1; }
          done

      # The runner has no rustup. A pinned rustup-init, checked by sha256, once
      # per runner user (~/.cargo persists); the toolchain comes from rust-toolchain.toml below.
      - name: Install rustup
        run: |
          set -euo pipefail
          if ! PATH="$HOME/.cargo/bin:$PATH" command -v rustup >/dev/null; then
            sha=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
            curl -sSfLo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init"
            echo "$sha  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # No arguments: installs exactly what rust-toolchain.toml names, components
      # included. The second line fails if that file is not what is active.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain | tee /dev/stderr | grep -q 'rust-toolchain.toml'

      - name: Check apt packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          read -ra pkgs <<<"$APT_PACKAGES"
          missing=()
          for p in "${pkgs[@]}"; do dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p"); done
          [ ${#missing[@]} -eq 0 ] || { echo "::error::not installed on this runner (sudo apt-get does not work here; add them to the build-runner playbook): ${missing[*]}"; exit 1; }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }} -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  # Blocking. An accepted advisory goes in audit-ignore (or .cargo/audit.toml)
  # with its reason; this job is never made non-blocking. "error loading
  # advisory database" means the cargo-audit pin is too old for the DB format:
  # bump the pin, do not ignore an id.
  audit:
    runs-on: [self-hosted, ukubi-build]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # A pinned release binary, checked by sha256 (ci.yml's actionlint pattern):
      # no compile, and no toolchain at all, since cargo audit reads only
      # Cargo.lock. The repo pin is never involved.
      - name: Install cargo-audit
        env:
          VERSION: 0.22.2
          SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          set -euo pipefail
          n="cargo-audit-x86_64-unknown-linux-musl-v${VERSION}"
          curl -sSfLo "$RUNNER_TEMP/$n.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${VERSION}/$n.tgz"
          echo "$SHA256  $RUNNER_TEMP/$n.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$n.tgz" -C "$RUNNER_TEMP" --strip-components=1 "$n/cargo-audit"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Audit
        env:
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r id; do
            id=${id//[[:space:]]/}
            [ -n "$id" ] || continue
            [[ "$id" =~ ^RUSTSEC-[0-9]{4}-[0-9]{4}$ ]] || { echo "::error::audit-ignore lines are RUSTSEC-YYYY-NNNN, got '$id'"; exit 1; }
            args+=(--ignore "$id")
          done <<<"$AUDIT_IGNORE"
          cargo-audit audit ${args[@]+"${args[@]}"}
