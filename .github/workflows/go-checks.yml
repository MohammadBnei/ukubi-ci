# Go checks for one module: gofmt, go vet, go test -race, and optionally
# golangci-lint and a vet tool (ukubicheck once it ships). The toolchain is
# the one go.mod names. working-directory must be a module directory (a go.work
# root that is not a module rejects `./...`). Inputs reach scripts through env
# only, never inline ${{ }}.
name: go-checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON list of runner labels; needs bash, git, curl and gcc (go test -race uses cgo). The default is the Talos runner label
          (ephemeral unprivileged pods, image ukubi-ci-runner); CT 103 callers pass '["ubuntu-latest"]', GitHub callers their own.
        type: string
        default: '["k8s-ubuntu-latest"]'
      working-directory:
        description: The module directory, relative to the repo root.
        type: string
        default: .
      golangci-lint-version:
        description: e.g. v2.14.0. Empty skips golangci-lint.
        type: string
        default: ''
      vettool:
        description: A vet tool as pkg@vX.Y.Z, run with go vet -vettool. Empty skips.
        type: string
        default: ''
      test-flags:
        description: Extra go test flags after -race, e.g. '-p 1' for tests sharing one database. Go's per-package test-result cache is on (no -count=1); see uncached-packages.
        type: string
        default: ''
      uncached-packages:
        description: >-
          Space-separated package patterns (e.g. ./core/internal/buildguard) whose tests read files outside their
          module or depend on state Go cannot track (DB-backed tests). They run in a second go test with
          -count=1 and the same flags, so the compiled test binaries are shared; every other package may be
          served from Go's test cache. Empty runs everything through the cache.
        type: string
        default: ''
      pre-test:
        description: >-
          A shell command run at the repo root before go test, for what is already on the runner (not
          services: the Talos runner has no container engine, so no 'docker compose up'). DB-backed tests
          do not belong here: run them in the caller's own job with the dev-db action (a disposable
          IntegreSQL database, DATABASE_URL exported), and exclude them from this call's ./... run.
        type: string
        default: ''
      govulncheck:
        description: Run govulncheck ./... (pinned v1.9.0). Fails only on vulnerabilities the code calls, not on unreachable module advisories.
        type: boolean
        default: false

jobs:
  go:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # test/reusable.sh runs the named blocks below verbatim; keep the names.
      - name: Check inputs
        env:
          LINT_VERSION: ${{ inputs.golangci-lint-version }}
          VETTOOL: ${{ inputs.vettool }}
          TEST_FLAGS: ${{ inputs.test-flags }}
          UNCACHED: ${{ inputs.uncached-packages }}
        run: |
          set -euo pipefail
          [ -f go.mod ] || { echo "::error::working-directory must be a Go module (no go.mod)"; exit 1; }
          v='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [ -z "$LINT_VERSION" ] || [[ "$LINT_VERSION" =~ $v ]] \
            || { echo "::error::golangci-lint-version must be vX.Y.Z, got '$LINT_VERSION'"; exit 1; }
          t='^[A-Za-z0-9._~/-]+@v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [ -z "$VETTOOL" ] || [[ "$VETTOOL" =~ $t ]] \
            || { echo "::error::vettool must be pkg@vX.Y.Z (never @latest), got '$VETTOOL'"; exit 1; }
          f='^[A-Za-z0-9 ._=,/:-]*$'
          [[ "$TEST_FLAGS" =~ $f ]] || { echo "::error::test-flags has characters outside [A-Za-z0-9 ._=,/:-]"; exit 1; }
          u='^[A-Za-z0-9 ._/-]*$'
          [[ "$UNCACHED" =~ $u ]] || { echo "::error::uncached-packages has characters outside [A-Za-z0-9 ._/-]"; exit 1; }

      # No setup-go cache: the split below is explicit (see "Cache keys").
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: false

      # Cache model (owner decision 2026-11-22): a pull request restores and
      # saves; push, tag, dispatch and schedule never restore (a PR job can
      # forge the cache write key, so a restored entry is untrusted on main),
      # they run cold and only save. Decided here in shell, not in an if:.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          # The ref alone decides: pull_request_target runs base code on the base
          # ref and must never restore what a PR job can write.
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          # A module without dependencies has no go.sum.
          h=$({ cat go.mod; [ ! -f go.sum ] || cat go.sum; } | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-go-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-go-${RUNNER_OS}-"
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: restore
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          # Never an exact hit (the run id is new): restore-keys picks the newest
          # entry for this lockfile, else the newest for this runner.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}

      # gofmt -l exits 0 on unformatted files, so the output is the check.
      # -r: no .go files must not hang gofmt on stdin. vendor/ and testdata/
      # are skipped, as ./... skips them.
      - name: gofmt
        run: |
          set -euo pipefail
          out=$(git ls-files -z -- '*.go' ':!:vendor/*' ':!:testdata/*' ':!:*/testdata/*' | xargs -0 -r gofmt -l)
          [ -z "$out" ] || { echo "::error::not gofmt-clean:"; echo "$out"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Pre-test
        if: inputs.pre-test != ''
        working-directory: .
        env:
          PRE_TEST: ${{ inputs.pre-test }}
        run: bash -euo pipefail -c "$PRE_TEST"

      - name: go test
        env:
          TEST_FLAGS: ${{ inputs.test-flags }}
          UNCACHED: ${{ inputs.uncached-packages }}
        run: |
          set -euo pipefail
          read -ra flags <<<"$TEST_FLAGS"
          read -ra unc <<<"$UNCACHED"
          if [ ${#unc[@]} -eq 0 ]; then
            go test -race ${flags[@]+"${flags[@]}"} ./...
            exit 0
          fi
          # Everything else through Go's test cache, then the uncached packages
          # with -count=1; the same build flags, so the binaries are shared.
          go list "${unc[@]}" > "$RUNNER_TEMP/uncached.txt"
          rest=()
          while IFS= read -r pkg; do rest+=("$pkg"); done < <(go list ./... | grep -vxFf "$RUNNER_TEMP/uncached.txt" || true)
          [ ${#rest[@]} -eq 0 ] || go test -race ${flags[@]+"${flags[@]}"} "${rest[@]}"
          go test -race -count=1 ${flags[@]+"${flags[@]}"} "${unc[@]}"

      # Built with the module's own toolchain; the module proxy and sumdb check it.
      - name: golangci-lint
        if: inputs.golangci-lint-version != ''
        env:
          LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/golangci" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$LINT_VERSION"
          "$RUNNER_TEMP/golangci/golangci-lint" run ./...

      - name: go vet -vettool
        if: inputs.vettool != ''
        env:
          VETTOOL: ${{ inputs.vettool }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vettool"
          GOBIN="$d" go install "$VETTOOL"
          tool=$(find "$d" -type f)
          if [ -z "$tool" ] || [ "$(wc -l <<<"$tool")" -ne 1 ]; then
            echo "::error::expected one binary from $VETTOOL"; exit 1
          fi
          go vet -vettool="$tool" ./...

      # Default symbol mode: exit 3 only when a vulnerable symbol is reachable.
      # Built with the module's own toolchain, so a stdlib advisory is judged
      # against the go.mod version (bump it to take the fix).
      - name: govulncheck
        if: inputs.govulncheck
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/govulncheck" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/govulncheck/govulncheck" ./...

      # Last, so it holds what the tests and tools built. Saved under a key with
      # this run's id, so the newest run's cache is the one the next PR restores.
      - name: Save Go cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
